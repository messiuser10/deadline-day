<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="description" content="Deadline Day: a multiplayer football auction and season simulator. An unofficial fan game." />
    <title>Deadline Day</title>
    <script>
      // Apply the saved theme before the first paint (dark is the default). Mirrors lib/prefs.ts.
      try {
        var p = JSON.parse(localStorage.getItem('dd-prefs') || '{}');
        if (p.theme === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f5f9');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Deadline Day needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
